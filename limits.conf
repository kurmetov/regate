# regate queue limits: copy to <project>/.regate/limits.conf and tune.
# each job runs in a scope at its cap, no swap. [total] memory bounds one job's cap: the machine's
# memory is judged by MemAvailable (see min_available). Elsewhere memory is the sum of the jobs' caps;
# threads is the sum of their CPU quotas (100% per thread). A key left out is no limit.
# Read on every admission: an edit applies to the next job without restarting anything.

[total]              # the whole machine (here 59 GB, 32 threads)
jobs = 4
memory = 34G
threads = 48
min_available = 8G   # a job starts if MemAvailable leaves this much with the job at its cap
max_caps = 44G       # running caps never sum past this: physical memory less ~15G outside the queue
# data_ext = csv json # a job's data file by extension: runs of one verb on one file share their memory peaks
min_disk = 20G       # admit only while this file's filesystem has at least this free

[build]              # cargo build/test/clippy/check: regate queue --kind build
jobs = 2
job_memory = 10G     # cap of one build unless -m
job_threads = 8      # CPU quota and CARGO_BUILD_JOBS of one build unless -t
max_runtime = 2h     # systemd ends a job running longer (s, m or h)
cpu_weight = 200     # CPU share against other jobs when the box is busy (default 100)

[heavy]              # long runs on big inputs, benchmarks, fuzzing: regate queue --kind heavy (the default)
jobs = 2
job_memory = 12G
job_threads = 16
max_runtime = 6h

[light]              # gate cases whose mem= is at most job_memory, seconds long
jobs = 2
memory = 2G          # outside [total], so [total] memory above leaves this much out by hand
job_memory = 1G
job_threads = 4
max_runtime = 10m
outside_total = yes  # counts against this section only: never waits behind heavy jobs

[gate]               # regate's own data dir
keep_binaries = 20   # built binaries kept (by last use), with their logs; history is never pruned

[user]               # every user (a Claude session, or --user / REGATE_QUEUE_USER)
jobs = 2
memory = 24G

# [user.session-1a2b3c4d]   # one user, by name prefix
# jobs = 1
